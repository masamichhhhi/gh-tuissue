name: Bug report
description: Report a problem in gh-tuissue
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem.
      placeholder: The assignee editor fails to apply changes
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps needed to reproduce the issue.
      placeholder: |
        1. Run `gh tuissue --repo owner/name --project 1`
        2. Open an issue detail view
        3. Press `a`
        4. Observe the failure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The selected assignee should be updated
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Describe what happened instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `gh tuissue --version`, if available.
      placeholder: gh-tuissue version v0.1.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, terminal, GitHub CLI version, and anything else relevant.
      placeholder: macOS 15, iTerm2, gh 2.x
